[project]
name = "ax-performance-advisor-plugin"
version = "0.1.0"
description = "Read-only Dynamics AX 2012 R3 and SQL Server 2016 performance advisor plugin."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "AX Performance Advisory" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.axpa.release]
read_only_default = true
exclude_from_release = ["evidence", "out", "__pycache__", ".pytest_cache", "dist"]
